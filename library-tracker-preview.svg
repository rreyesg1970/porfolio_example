<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Community Library Tracker preview</title><desc id="desc">A sample library dashboard with a book search field, recent loans, and catalog status cards.</desc><rect width="800" height="480" rx="22" fill="#eef2ff"/><rect x="24" y="24" width="752" height="432" rx="18" fill="#fff" stroke="#dbe3f0"/><rect x="24" y="24" width="752" height="58" rx="18" fill="#172554"/><path d="M24 64h752v18H24z" fill="#172554"/><circle cx="52" cy="53" r="6" fill="#a5b4fc"/><circle cx="73" cy="53" r="6" fill="#818cf8"/><circle cx="94" cy="53" r="6" fill="#6366f1"/><text x="124" y="59" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Community Library</text><text x="661" y="58" fill="#c7d2fe" font-family="Arial,sans-serif" font-size="13">STAFF VIEW</text><text x="58" y="125" fill="#172554" font-family="Arial,sans-serif" font-size="24" font-weight="700">Good morning, Alex</text><text x="58" y="150" fill="#64748b" font-family="Arial,sans-serif" font-size="13">Here’s what’s happening at your library today.</text><rect x="58" y="174" width="684" height="48" rx="9" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="82" cy="197" r="8" fill="none" stroke="#64748b" stroke-width="2"/><path d="m88 203 7 7" stroke="#64748b" stroke-width="2"/><text x="108" y="202" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">Search books, authors, or ISBN…</text><rect x="58" y="244" width="210" height="74" rx="10" fill="#eef2ff"/><text x="78" y="273" fill="#4f46e5" font-family="Arial,sans-serif" font-size="13" font-weight="700">BOOKS IN CATALOG</text><text x="78" y="301" fill="#172554" font-family="Arial,sans-serif" font-size="25" font-weight="700">1,248</text><rect x="284" y="244" width="210" height="74" rx="10" fill="#ecfdf5"/><text x="304" y="273" fill="#059669" font-family="Arial,sans-serif" font-size="13" font-weight="700">ACTIVE LOANS</text><text x="304" y="301" fill="#172554" font-family="Arial,sans-serif" font-size="25" font-weight="700">36</text><rect x="510" y="244" width="232" height="74" rx="10" fill="#fff7ed"/><text x="530" y="273" fill="#ea580c" font-family="Arial,sans-serif" font-size="13" font-weight="700">DUE THIS WEEK</text><text x="530" y="301" fill="#172554" font-family="Arial,sans-serif" font-size="25" font-weight="700">12</text><text x="58" y="353" fill="#172554" font-family="Arial,sans-serif" font-size="16" font-weight="700">Recent loans</text><rect x="58" y="368" width="684" height="1" fill="#e2e8f0"/><text x="70" y="395" fill="#334155" font-family="Arial,sans-serif" font-size="13">The Midnight Library</text><text x="429" y="395" fill="#64748b" font-family="Arial,sans-serif" font-size="13">M. Haig · due Nov 06</text><rect x="663" y="379" width="64" height="23" rx="11" fill="#dcfce7"/><text x="675" y="395" fill="#15803d" font-family="Arial,sans-serif" font-size="11" font-weight="700">ON LOAN</text><rect x="58" y="413" width="684" height="1" fill="#e2e8f0"/><text x="70" y="438" fill="#334155" font-family="Arial,sans-serif" font-size="13">A Brief History of Time</text><text x="429" y="438" fill="#64748b" font-family="Arial,sans-serif" font-size="13">S. Hawking · due Nov 09</text></svg>